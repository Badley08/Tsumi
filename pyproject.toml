[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tsumi"
version = "0.1.0"
description = "Lecteur de manga, manhwa, manhua et webtoon"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Badley08", email = "badley08@users.noreply.github.com" }]
keywords = ["manga", "manhwa", "manhua", "webtoon", "cbz", "reader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rarfile>=4.0",
    "lxml>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/Badley08/Tsumi"
Repository = "https://github.com/Badley08/Tsumi"
"Bug Tracker" = "https://github.com/Badley08/Tsumi/issues"

[project.scripts]
tsumi = "app.karlitodev.tsumi.Main:main"

[project.gui-scripts]
tsumi-gui = "app.karlitodev.tsumi.Main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.karlitodev.tsumi" = ["assets/**/*", "sources/**/*.json"]
