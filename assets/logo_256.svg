<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="kanjiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#1671e3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feFlood flood-color="#1671e3" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#1671e3" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40"
        fill="url(#bgGrad)" filter="url(#outerGlow)"/>

  <!-- Accent line -->
  <rect x="40" y="8" width="176" height="2" rx="1"
        fill="url(#kanjiGrad)" opacity="0.6"/>

  <!-- Kanji 詰 centered -->
  <text
    x="128" y="165"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Noto Serif JP', 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif"
    font-size="150"
    font-weight="600"
    fill="url(#kanjiGrad)"
    stroke="#1671e3"
    stroke-width="1"
    filter="url(#glow)"
  >詰</text>
</svg>
