<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: dark top to darker bottom -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Kanji gradient: blue to near-white -->
    <linearGradient id="kanjiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#1671e3"/>
    </linearGradient>

    <!-- Glow filter for the kanji -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feFlood flood-color="#1671e3" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow on background shape -->
    <filter id="outerGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#1671e3" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square with dark gradient -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80"
        fill="url(#bgGrad)" filter="url(#outerGlow)"/>

  <!-- Subtle blue top-edge accent line -->
  <rect x="80" y="16" width="352" height="4" rx="2"
        fill="url(#kanjiGrad)" opacity="0.6"/>

  <!-- Kanji 詰 centered with glow effect -->
  <text
    x="256" y="330"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Noto Serif JP', 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif"
    font-size="300"
    font-weight="600"
    fill="url(#kanjiGrad)"
    stroke="#1671e3"
    stroke-width="1.5"
    filter="url(#glow)"
  >詰</text>
</svg>
